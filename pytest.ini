[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = 
    -v 
    -s 
    --html=reports/report.html 
    --self-contained-html
    --capture=sys

markers =
    e2e: End-to-end e-commerce purchase scenarios
    datadriven: Data-driven tests using external files
    excel: Excel-driven tests using openpyxl
    json: JSON-driven tests
    regression: Regression test cases

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
